# Weekly dependency PRs; each one is validated by the CI workflow.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /simulator
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /api
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /ingestion
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /transform
    schedule: { interval: weekly }
