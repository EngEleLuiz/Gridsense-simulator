apiVersion: 1

# Uses Grafana's built-in $__env{VAR_NAME} provisioning macro instead
# of hardcoding credentials in this committed file. Requires
# TIMESCALE_USER and TIMESCALE_PASSWORD to be set on the grafana
# service's environment (see docker-compose.yml) -- same local dev
# defaults as everywhere else in the project (postgres/postgres),
# just no longer duplicated as a literal value in version control.
datasources:
  - name: GridSense TimescaleDB
    uid: gridsense-timescaledb
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: gridsense
    user: $__env{TIMESCALE_USER}
    isDefault: true
    editable: true
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    secureJsonData:
      password: $__env{TIMESCALE_PASSWORD}
