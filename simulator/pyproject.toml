[project]
name = "gridsense-sim"
version = "0.1.0"
description = "Electrical grid digital twin simulator (Phase 1: local power-flow simulation engine)"
requires-python = ">=3.10"
dependencies = [
    "pandapower>=2.14",
    "pandas>=1.5",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
kafka = [
    "confluent-kafka>=2.3",
]

[project.scripts]
gridsense-sim = "gridsense_sim.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gridsense_sim*"]
