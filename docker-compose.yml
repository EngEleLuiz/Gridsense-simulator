# Local streaming infrastructure for GridSense Simulator — Phase 2.
#
# Everything here is free and open-source, self-hosted on your own
# machine: a single-broker Apache Kafka (KRaft mode, no Zookeeper,
# no license) plus an optional web UI. No cloud account, no managed
# service, and no monetary cost are required to run this stack.
#
# Usage:
#   docker compose up -d      # start Kafka + UI
#   docker compose logs -f    # tail logs
#   docker compose down       # stop (add -v to also wipe local data)

services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    container_name: gridsense-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Optional web UI to browse topics/messages while developing.
  # Free and open-source; safe to remove if you prefer the CLI tools.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: gridsense-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  # TimescaleDB (PostgreSQL + native time-series extension) — the
  # warehouse target for the dbt project in transform/. Free and
  # open-source (Apache 2.0 / Timescale License), self-hosted.
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: gridsense-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gridsense
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gridsense"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Grafana — dashboards over the Gold marts. Datasource and the
  # GridSense Overview dashboard are auto-provisioned from
  # grafana/provisioning/ and grafana/dashboards/ (no manual
  # click-through setup needed). Free and open-source, self-hosted.
  grafana:
    image: grafana/grafana-oss:latest
    container_name: gridsense-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Read by grafana/provisioning/datasources/timescaledb.yml via
      # Grafana's $__env{} provisioning macro, so the TimescaleDB
      # credential isn't a literal value in a committed file. Same
      # local dev default as everywhere else in the project.
      TIMESCALE_USER: postgres
      TIMESCALE_PASSWORD: postgres
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      timescaledb:
        condition: service_healthy

  # Optional: containerized API. Not started by `docker compose up -d`
  # by default (profile-gated) -- for local dev, running
  # `uvicorn app.main:app --reload` directly is faster to iterate on.
  # Opt in with: docker compose --profile api up -d api
  api:
    build: ./api
    container_name: gridsense-api
    profiles: ["api"]
    ports:
      - "8000:8000"
    environment:
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: "5432"
      TIMESCALE_USER: postgres
      TIMESCALE_PASSWORD: postgres
      TIMESCALE_DB: gridsense
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  kafka-data:
  timescale-data:
  grafana-data:
