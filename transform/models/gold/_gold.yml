version: 2

models:
  - name: mart_voltage_quality_hourly
    description: >
      Hourly voltage-quality KPIs per bus: mean/min/max/stddev voltage,
      and the percentage of readings that violated the network's own
      voltage tolerance (see transform/seeds/network_voltage_limits.csv
      -- ANSI C84.1 Range A for the transmission test cases, +-10%
      for cigre_lv). Intended for direct consumption by dashboards
      (Grafana) or ad-hoc quality reports.

  - name: mart_line_loading_hourly
    description: >
      Hourly line-loading KPIs per transmission line, including
      overload event counts and rates. Highlights which lines are
      chronically stressed vs. lightly loaded.

  - name: mart_grid_kpis_daily
    description: >
      Daily system-level KPIs: peak/average/min load, average
      generation, load factor, and the count of simulation steps with
      an active contingency.

  - name: mart_hosting_capacity
    description: >
      Side-by-side comparison of the deterministic, stochastic and QSTS
      hosting-capacity methods. Filter on is_comparable and compare only
      rows with the same criterion_framework (and load_scale for snapshot
      methods). Legacy v1 rows are retained but never comparable.
    columns:
      - name: network
        tests: [not_null]
      - name: method
        tests: [not_null]
      - name: is_comparable
        tests: [not_null]
      - name: total_pv_mw_comparable
        description: >
          deterministic/qsts: PV at the largest verified-feasible lambda.
          stochastic: F^-1(hc_alpha) of the critical penetration
          (conservative quantile). NULL unless is_comparable.
      - name: criterion_framework
        description: "Voltage framework (ansi_c84_range_a | prodist_m8_bt | en50160_envelope)."
      - name: load_scale
        description: "Load multiplier at the evaluated operating point; NULL for QSTS."

