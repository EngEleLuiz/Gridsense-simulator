version: 2

models:
  - name: stg_grid_telemetry
    description: >
      One row per simulated power-flow step. Scalar fields (load,
      generation, step, network, timestamps) are typed; per-bus,
      per-line, and per-generator readings remain as jsonb, unnested
      downstream in the Silver layer.
    columns:
      - name: step
        description: "Simulation step index (0-based, monotonically increasing per run)."
        tests: [not_null]
      - name: network
        description: "IEEE test network used for the run, e.g. case14."
        tests: [not_null]
      - name: event_timestamp
        description: "Simulated wall-clock timestamp for this step."
        tests: [not_null]
      - name: total_load_mw
        tests: [not_null]
      - name: total_generation_mw
        tests: [not_null]

  - name: stg_hosting_capacity_results
    description: >
      Typed view over bronze.hosting_capacity_results (payload v1 legacy
      and v2). is_comparable = schema_version >= 2 and status = 'ok' and
      bounded; total_pv_mw_comparable is NULL whenever is_comparable is
      false. See the model's header comment.
    columns:
      - name: network
        tests: [not_null]
      - name: method
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['deterministic', 'stochastic', 'qsts']
      - name: run_id
        tests: [not_null]
      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ok', 'baseline_infeasible', 'no_daylight', 'error', 'legacy_invalid']
      - name: is_comparable
        tests: [not_null]
