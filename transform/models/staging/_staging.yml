version: 2

models:
  - name: stg_grid_telemetry
    description: >
      One row per simulated power-flow step. Scalar fields (load,
      generation, step, network, timestamps) are typed; per-bus,
      per-line, and per-generator readings remain as jsonb, unnested
      downstream in the Silver layer.
    columns:
      - name: step
        description: "Simulation step index (0-based, monotonically increasing per run)."
        tests: [not_null]
      - name: network
        description: "IEEE test network used for the run, e.g. case14."
        tests: [not_null]
      - name: event_timestamp
        description: "Simulated wall-clock timestamp for this step."
        tests: [not_null]
      - name: total_load_mw
        tests: [not_null]
      - name: total_generation_mw
        tests: [not_null]

  - name: stg_hosting_capacity_results
    description: >
      Typed view over bronze.hosting_capacity_results. Method-specific
      fields (lambda_max/binding_constraint for deterministic/qsts;
      violation_rate/n_trials for stochastic; qsts_total_steps/
      qsts_steps_per_day for qsts) are NULL when not applicable to
      that row's method, never defaulted to zero.
    columns:
      - name: network
        tests: [not_null]
      - name: method
        description: "One of: deterministic, stochastic, qsts."
        tests: [not_null]
      - name: run_id
        tests: [not_null]
      - name: total_pv_mw_comparable
        description: >
          The one field every method populates: deterministic/qsts
          report total_pv_mw directly; stochastic reports its p50
          here. See this model's own top-of-file comment for the
          stochastic calibration caveat before comparing it directly
          to the other two methods.
