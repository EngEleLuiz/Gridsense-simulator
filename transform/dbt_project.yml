name: 'gridsense_transform'
version: '1.0.0'
config-version: 2

profile: 'gridsense'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Layered materialization strategy:
#   staging -> views (cheap, always fresh, thin typing layer over Bronze)
#   silver  -> tables (unnested, tidy fact tables; hypertables via post-hook)
#   gold    -> tables (pre-aggregated marts for dashboards / BI tools)
models:
  gridsense_transform:
    staging:
      +materialized: view
      +schema: staging
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
