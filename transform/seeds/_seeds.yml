version: 2

seeds:
  - name: network_voltage_limits
    description: >
      Default voltage band per network. Must match
      simulator/gridsense_sim/hosting_capacity/limits.py
      (enforced by simulator/tests/test_hc_cross_layer.py).
    columns:
      - name: network
        tests: [unique, not_null]
      - name: v_min_pu
        tests: [not_null]
      - name: v_max_pu
        tests: [not_null]

  - name: network_voltage_scope
    description: >
      Buses whose voltage is judged (customer service points), one row
      per (network, bus_id). Generated by
      scripts/generate_voltage_scope_seed.py from
      hosting_capacity/scope.py -- do not edit by hand.
    columns:
      - name: network
        tests: [not_null]
      - name: bus_id
        tests: [not_null]
